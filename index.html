<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Circle Editor</title>
    <meta
      name="description"
      content="Browser-based procedural generator and manual editor for designing magic-circle VFX. Export transparent PNG textures for Unreal Engine 5."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://circle-editor.pages.dev/circleeditor/" />
    <meta property="og:title" content="Circle Editor" />
    <meta
      property="og:description"
      content="Design magic-circle VFX in the browser. Procedural generator + non-destructive layer editor. Export transparent PNG textures for UE5."
    />
    <meta
      property="og:image"
      content="https://circle-editor.pages.dev/circleeditor/social-preview.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Circle Editor" />
    <meta
      name="twitter:description"
      content="Design magic-circle VFX in the browser. Export transparent PNG textures for UE5."
    />
    <meta
      name="twitter:image"
      content="https://circle-editor.pages.dev/circleeditor/social-preview.png"
    />
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('magic-circle-editor:preferences') || '{}')
        document.documentElement.setAttribute('data-theme', p.theme || 'dark')
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
